name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      f1_old: ${{ steps.upload_artifact.outputs.f1_old }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PYEOF'
          import json, os
          creds = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          aws_key = os.environ.get("AWS_ACCESS_KEY_ID", "").strip()
          aws_secret = os.environ.get("AWS_SECRET_ACCESS_KEY", "").strip()
          env_file = os.environ.get("GITHUB_ENV")

          if creds and creds.startswith("{"):
              try:
                  data = json.loads(creds)
                  if "aws_access_key_id" in data:
                      with open(env_file, "a") as f:
                          f.write(f"AWS_ACCESS_KEY_ID={data['aws_access_key_id']}\n")
                          f.write(f"AWS_SECRET_ACCESS_KEY={data['aws_secret_access_key']}\n")
                          f.write("AWS_DEFAULT_REGION=ap-southeast-1\n")
                  elif "type" in data and data.get("type") == "service_account":
                      with open("/tmp/sa-key.json", "w") as f:
                          f.write(creds)
                      with open(env_file, "a") as f:
                          f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
              except Exception as e:
                  print("Error parsing credentials:", e)
          elif aws_key and aws_secret:
              with open(env_file, "a") as f:
                  f.write(f"AWS_ACCESS_KEY_ID={aws_key}\n")
                  f.write(f"AWS_SECRET_ACCESS_KEY={aws_secret}\n")
                  f.write("AWS_DEFAULT_REGION=ap-southeast-1\n")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Print detailed evaluation report (Bonus 3)
        run: |
          if [ -f outputs/detail.txt ]; then
            cat outputs/detail.txt
          fi

      - name: Upload model to Cloud Storage
        id: upload_artifact
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os, json
          bucket = os.environ["ARTIFACT_BUCKET"]
          f1_old = 0.0

          f1_current = 0.0
          if os.path.exists("outputs/report.json"):
              with open("outputs/report.json") as f:
                  f1_current = float(json.load(f).get("f1_score", 0))

          # Bonus 4: Doc F1 cua model cu tren Cloud Storage truoc khi ghi de
          try:
              if os.environ.get("GOOGLE_APPLICATION_CREDENTIALS"):
                  from google.cloud import storage
                  client = storage.Client()
                  b = client.bucket(bucket)
                  old_blob = b.blob("artifacts/current/report.json")
                  if old_blob.exists():
                      f1_old = float(json.loads(old_blob.download_as_text()).get("f1_score", 0))
                  
                  if f1_current >= f1_old:
                      blob_m = b.blob("artifacts/current/model.joblib")
                      blob_m.upload_from_filename("models/model.joblib")
                      blob_r = b.blob("artifacts/current/report.json")
                      blob_r.upload_from_filename("outputs/report.json")
                      print(f"Uploaded model & report to GCS (new F1 {f1_current:.4f} >= old F1 {f1_old:.4f})")
                  else:
                      print(f"Skipping overwrite on GCS: new F1 ({f1_current:.4f}) < old F1 ({f1_old:.4f})")
              else:
                  import boto3
                  s3 = boto3.client("s3")
                  try:
                      resp = s3.get_object(Bucket=bucket, Key="artifacts/current/report.json")
                      f1_old = float(json.loads(resp["Body"].read().decode("utf-8")).get("f1_score", 0))
                  except Exception:
                      pass
                  
                  if f1_current >= f1_old:
                      s3.upload_file("models/model.joblib", bucket, "artifacts/current/model.joblib")
                      s3.upload_file("outputs/report.json", bucket, "artifacts/current/report.json")
                      print(f"Uploaded model & report to S3 (new F1 {f1_current:.4f} >= old F1 {f1_old:.4f})")
                  else:
                      print(f"Skipping overwrite on S3: new F1 ({f1_current:.4f}) < old F1 ({f1_old:.4f})")
          except Exception as e:
              print("Cloud upload warning:", e)

          env_output = os.environ.get("GITHUB_OUTPUT")
          if env_output:
              with open(env_output, "a") as f:
                  f.write(f"f1_old={f1_old}\n")
          PYEOF

      - name: Save report as artifact (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate & rollback safety (Bonus 4)
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score = {f1:.4f} >= 0.65.")

          # Bonus 4: Kiem tra rollback safety
          f1_old_str = "${{ needs.train.outputs.f1_old }}".strip()
          if f1_old_str and float(f1_old_str) > 0:
              f1_old = float(f1_old_str)
              if f1 < f1_old:
                  raise SystemExit(f"FAILED (ROLLBACK SAFETY): F1 moi ({f1:.4f}) < F1 cu ({f1_old:.4f}). Huy trien khai de tranh suy giam chat luong.")
              print(f"PASSED (BONUS 4 - MODEL COMPARISON): F1 moi ({f1:.4f}) >= F1 cu ({f1_old:.4f}). Cho phep release!")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
